# Load necessary modules for PHP-FPM
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
LoadModule dir_module modules/mod_dir.so
LoadModule rewrite_module modules/mod_rewrite.so

# Ensure the server listens on port 80
Listen 80

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Set server name (optional, but good practice)
    ServerName localhost

    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks
        AllowOverride All # Allow .htaccess files
        Require all granted
    </Directory>

    # Handle URL rewriting for Laravel
    <Directory /var/www/html>
        RewriteEngine On
        RewriteRule ^(.*)/$ /$1 [L,R=301]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    # Pass PHP requests to the PHP-FPM service
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://app:9000" # 'app' is the name of your PHP-FPM service
    </FilesMatch>

    # Error logging
    ErrorLog /proc/self/fd/2 # Log to stderr, visible in 'docker-compose logs'
    CustomLog /proc/self/fd/1 combined # Log to stdout
</VirtualHost>